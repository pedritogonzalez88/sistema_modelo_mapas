# Producción — un solo host, app y PostgreSQL sin puertos publicados.
# Uso:
#   docker compose --env-file .env.production \
#     -f docker-compose.prod.yml up -d --build
name: eet-prod

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: eet-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eet}
      POSTGRES_USER: ${POSTGRES_USER:-eet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - eet-prod-pgdata:/var/lib/postgresql/data
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eet} -d ${POSTGRES_DB:-eet}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eet-app-prod
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      # El password debe ser URL-safe (ver prepare-production.ps1).
      EET_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-eet}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-eet}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    # Imagen non-root: el directorio de uploads del host debe pertenecer a
    # 10001:10001 (ver README de producción).
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 256
    stop_grace_period: 30s
    healthcheck:
      # /ready comprueba la base; /salud solo demuestra que Uvicorn responde.
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 90s
    networks:
      internal:
        ipv4_address: 172.30.0.11
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  proxy:
    image: nginx:1.27-alpine
    container_name: eet-proxy-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      internal:
        ipv4_address: 172.30.0.10
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m
      - /var/run:size=8m
      - /tmp:size=8m
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  eet-prod-pgdata:
