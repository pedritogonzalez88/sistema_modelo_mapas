# Entorno de staging del Validador EET (A6.12).
#
# Ensaya el despliegue real —TLS terminado en un proxy, cookies `__Host-`,
# `EET_AUTH_ENABLED=true` y proxy de confianza— sin tocar el entorno de
# desarrollo (`docker-compose.yml`, puertos 8000/5432).
#
#   docker compose -f deploy/docker-compose.staging.yml \
#     --env-file deploy/.env.staging up -d --build
#
# Diferencias deliberadas con desarrollo:
#   - La aplicación NO publica puertos: solo la alcanza el proxy por la red
#     interna (`app:8000`).
#   - La base solo se publica en loopback (127.0.0.1:5434) y usa un volumen
#     propio (`eet-staging_eet-staging-pgdata`), para no rozar el de dev.
#   - El proxy tiene IP fija (172.28.0.10) para que `EET_TRUSTED_PROXY_IPS`
#     sea un CIDR estable y `X-Forwarded-Proto/For` se acepten solo de él.

name: eet-staging

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: eet-db-staging
    environment:
      POSTGRES_DB: eet
      POSTGRES_USER: eet
      POSTGRES_PASSWORD: eet
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - eet-staging-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eet -d eet"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - staging

  app:
    build:
      # El contexto es la raíz del repositorio: el Dockerfile es el mismo que
      # se usa en producción (CSS compilado + `alembic upgrade head` al
      # arrancar), así el ensayo valida la imagen real.
      context: ..
      dockerfile: Dockerfile
    container_name: eet-app-staging
    env_file:
      - .env.staging
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Volumen propio: no comparte archivos con desarrollo.
      - eet-staging-uploads:/app/uploads
    healthcheck:
      # `python` del sistema alcanza: urllib es de la biblioteca estándar.
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      # El arranque aplica Alembic antes de Uvicorn.
      start_period: 40s
    networks:
      - staging

  proxy:
    image: nginx:1.27-alpine
    container_name: eet-proxy-staging
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Certificados locales generados por scripts/gen-dev-cert.py (ignorados
      # por Git). En producción se monta el certificado del dominio.
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      staging:
        # IP fija: es el valor de EET_TRUSTED_PROXY_IPS (172.28.0.10/32).
        ipv4_address: 172.28.0.10

volumes:
  eet-staging-pgdata:
  eet-staging-uploads:

networks:
  staging:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
