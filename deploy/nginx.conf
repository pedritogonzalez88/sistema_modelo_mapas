# Validador EET — reverse proxy de staging (A6.12).
#
# Se monta como /etc/nginx/conf.d/default.conf, así que este archivo vive en el
# contexto `http` del nginx base. En producción se reemplazan únicamente el
# certificado, el `server_name` y el puerto del redirect.
#
# La aplicación emite sus propias cabeceras de seguridad (CSP con nonce, HSTS,
# nosniff, X-Frame-Options…). Aquí NO se duplican: duplicarlas produciría dos
# valores en la misma cabecera y algunos navegadores descartan la política.
# HSTS depende de que la app vea `X-Forwarded-Proto: https`, de ahí que el
# proxy tenga IP fija y `EET_TRUSTED_PROXY_IPS` la declare.

server_tokens off;

# --- 80: solo redirección a HTTPS ---------------------------------------------
server {
    listen 80;
    server_name _;

    # Puerto HTTPS publicado por el proxy. En staging es 8443; en producción
    # con 443 póngalo en 443 (o quite el sufijo del Location).
    set $puerto_https 8443;

    return 301 https://$host:$puerto_https$request_uri;
}

# --- 443: TLS + proxy a la aplicación -----------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Alineado con EET_MAX_UPLOAD_MB (20 MB). El proxy rechaza el cuerpo antes
    # de que llegue a la aplicación; la app vuelve a validarlo (413 HTML).
    client_max_body_size 20m;

    location / {
        proxy_pass         http://app:8000;
        proxy_http_version 1.1;
        # Sin keep-alive explícito hacia el upstream, nginx reutiliza la
        # conexión y evita un handshake por petición.
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-Host  $host;

        # Tiempos razonables para un panel administrativo: conexión corta,
        # lectura holgada (exportaciones y cargas de hasta 20 MB).
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Las respuestas llevan `no-store` (auth) o las cabeceras de la app;
        # no se reescriben aquí.
        proxy_buffering off;
    }
}
