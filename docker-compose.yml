services:
  db:
    image: postgis/postgis:16-3.4
    container_name: eet-mapa-aep
    environment:
      POSTGRES_DB: eet
      POSTGRES_USER: eet
      POSTGRES_PASSWORD: eet
    ports:
      - "5432:5432"
    volumes:
      - eet-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eet -d eet"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: eet-app
    environment:
      EET_DATABASE_URL: postgresql+psycopg://eet:eet@db:5432/eet
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

volumes:
  eet-pgdata:
