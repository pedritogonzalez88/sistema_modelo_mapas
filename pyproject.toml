[project]
name = "sistema-modelo-mapas"
version = "0.1.0"
description = "Sistema de Validacion de Exactitud Tematica (EET) - INGEI BTR2 Paraguay"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "pydantic",
    "pydantic-settings",
    "openpyxl",
    "python-multipart",
    "psycopg[binary]>=3.3.6",
    "geoalchemy2>=0.20.0",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requiere PostgreSQL (docker compose up -d)"]
addopts = "-m 'not integration'"
