[project]
name = "sistema-modelo-mapas"
version = "0.1.0"
description = "Sistema de Validacion de Exactitud Tematica (EET) - INGEI BTR2 Paraguay"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "pydantic",
    "pydantic-settings",
    "openpyxl",
    "python-multipart",
    "psycopg[binary]>=3.3.6",
    "geoalchemy2>=0.20.0",
    "jinja2>=3.1.6",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "segno>=1.6",
    "cryptography>=42",
    "ldap3>=2.9",
    "aiosmtplib>=3.0",
    "email-validator>=2.1",
    "alembic>=1.13",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "pytest-cov>=7.1.0",
    "import-linter>=2.16",
    "mypy>=2.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requiere PostgreSQL (docker compose up -d)"]
addopts = "-m 'not integration'"

[tool.ruff.lint]
# B008: Depends() en defaults es el patrón idiomático de FastAPI.
# BLE001: los except amplios están en integraciones que deben degradar.
# DTZ003/ISC004: timestamps naive del esquema y concatenación de texto.
ignore = ["B008", "BLE001", "DTZ003", "ISC004"]

[tool.ruff.lint.per-file-ignores]
# Fachadas de compatibilidad con re-exports explícitos.
"app/auth/service.py" = ["F401", "F403", "F405"]
"app/auth/providers.py" = ["F401", "F403", "F405"]

[tool.mypy]
python_version = "3.12"
files = ["app/domain", "app/core", "app/services"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true

[tool.coverage.run]
source = ["app"]
omit = ["app/static/*", "app/templates/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.importlinter]
root_packages = ["app"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "El dominio no depende de infraestructura"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "app.core",
    "app.models",
    "app.services",
    "app.routers",
    "app.auth",
    "fastapi",
    "sqlalchemy",
    "jinja2",
]

[[tool.importlinter.contracts]]
name = "Los servicios no dependen de la capa web"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = ["app.routers", "app.web", "fastapi"]

[[tool.importlinter.contracts]]
name = "Core no depende de capas superiores"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.services", "app.routers", "app.auth", "app.web"]
