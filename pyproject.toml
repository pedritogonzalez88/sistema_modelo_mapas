[project]
name = "sistema-modelo-mapas"
version = "0.1.0"
description = "Sistema de Validacion de Exactitud Tematica (EET) - INGEI BTR2 Paraguay"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "pydantic",
    "pydantic-settings",
    "openpyxl",
    "python-multipart",
    "psycopg[binary]>=3.3.6",
    "geoalchemy2>=0.20.0",
    "jinja2>=3.1.6",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "segno>=1.6",
    "cryptography>=42",
    "ldap3>=2.9",
    "aiosmtplib>=3.0",
    "email-validator>=2.1",
    "alembic>=1.13",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requiere PostgreSQL (docker compose up -d)"]
addopts = "-m 'not integration'"
