name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --dev
      - name: Ruff
        run: uv run ruff check app scripts tests migrations
      - name: Compilación
        run: uv run python -m compileall -q app scripts migrations
      - name: Reglas de arquitectura
        run: uv run lint-imports
      - name: Tipado (dominio y core)
        run: uv run mypy

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --dev
      - name: Pruebas sin integración
        run: uv run pytest -q -p no:warnings

  integration:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: eet
          POSTGRES_USER: eet
          POSTGRES_PASSWORD: eet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eet -d eet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EET_DATABASE_URL: postgresql+psycopg://eet:eet@localhost:5432/eet
      EET_ENVIRONMENT: dev
      EET_AUTH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --dev
      - name: Migraciones
        run: uv run alembic upgrade head
      - name: Verificar modelos vs migraciones
        run: uv run alembic check
      - name: Semilla base (proyecto/usuarios)
        run: |
          uv run python - <<'PY'
          from app.core.database import SessionLocal
          from app.services import persist
          with SessionLocal() as db:
              persist.seed(db)
          PY
      - name: Cobertura unitaria
        run: uv run pytest -q -p no:warnings --cov=app --cov-report= --cov-fail-under=0
      - name: Pruebas de integración con cobertura
        run: >-
          uv run pytest -m integration -o addopts= -q -p no:warnings
          --cov=app --cov-append --cov-report=term-missing --cov-fail-under=80

  build:
    runs-on: ubuntu-latest
    needs: [lint, unit, integration]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Iniciar sesión en GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
