# Nginx EXTERNO para el modo HTTP de docker-compose.http.yml.
#
# Este archivo vive en el host (por ejemplo /etc/nginx/conf.d/eet.conf) o en
# el contenedor de su proxy. La app escucha en 127.0.0.1:8000 y no publica
# puertos públicos. Ajuste dominio, certificados y rutas.
#
# La app ya emite CSP, X-Frame-Options, Referrer-Policy y HSTS cuando ve
# X-Forwarded-Proto=https; por eso aquí no se duplican esas cabeceras.

server {
    listen 80;
    server_name evaluacioneet.aep.gov.py;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name eet.example.gov.py;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/eet.example.gov.py/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eet.example.gov.py/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Debe coincidir con EET_MAX_UPLOAD_MB.
    client_max_body_size 20m;
    client_body_timeout 60s;

    location / {
        # Nginx en el host:
        proxy_pass         http://127.0.0.1:8000;
        # Nginx en un contenedor con red compartida con la app:
        # proxy_pass       http://app:8000;

        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
