# Nginx en el contenedor (modo HTTP, sin TLS).
# Usado por docker-compose.http.yml cuando el TLS se termina en un frontal externo
# o cuando se accede por HTTP durante pruebas/staging.

server {
    listen 80;
    server_name _;

    server_tokens off;

    # Debe coincidir con EET_MAX_UPLOAD_MB.
    client_max_body_size 20m;
    client_body_timeout 60s;

    location / {
        proxy_pass         http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
